{% extends "base.html" %}
{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap"><form id="registerForm" class="card form-card">
<h1>Create your account</h1><p>Save your plans and access your recommendation history.</p>
<label>Name<input type="text" name="name" minlength="2" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="6" required></label>
<button class="btn primary" type="submit">Register</button>
<div id="formMessage" class="message"></div>
<p>Already registered? <a href="/login">Login</a></p>
</form></section>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
