{% extends "base.html" %}
{% block title %}Login · PocketSmart AI{% endblock %}
{% block content %}
<section class="auth-wrap"><form id="loginForm" class="card form-card">
<h1>Welcome back</h1><p>Log in to save and review your recommendations.</p>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" required></label>
<button class="btn primary" type="submit">Login</button>
<div id="formMessage" class="message"></div>
<p>New here? <a href="/register">Create an account</a></p>
</form></section>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
